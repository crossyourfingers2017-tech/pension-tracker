<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102d43"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Solar Tracker"><link rel="manifest" href="./manifest.json"><title>Solar & Battery Tracker</title><meta name="description" content="Track solar generation, bills, export income and system payback.">
<style>
:root{font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#18364b;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{background:#102d43;color:white;padding:20px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:1.45rem;margin:0}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #a9bbc3;border-radius:10px;padding:10px 14px;color:#17384e;background:white}button.active,button.primary{background:#087f78;color:white;border-color:#087f78}button:hover{filter:brightness(.94)}main{max-width:1160px;margin:auto;padding:24px 20px 70px}h2{font-size:1.35rem;margin:0 0 16px}h3{margin:0 0 12px}.muted{color:#5d7180}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #d8e4e8;border-radius:16px;padding:20px;box-shadow:0 4px 16px #15374a09}.card span{display:block;color:#58707d;font-size:.88rem}.card strong{display:block;font-size:1.8rem;margin-top:5px;font-variant-numeric:tabular-nums}.card small{color:#58707d}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.panel{margin-bottom:16px}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #e9eff1}.row:last-child{border:0}.row b{font-variant-numeric:tabular-nums}.bar{height:14px;background:#e0e9ec;border-radius:9px;overflow:hidden;margin:16px 0}.bar i{display:block;height:100%;background:#e7a434}.plot{width:100%;height:230px}.tablewrap{overflow:auto;background:white;border:1px solid #d8e4e8;border-radius:14px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid #e7edef;white-space:nowrap}th{background:#e8f1f3;font-size:.83rem;color:#365468}td.num{text-align:right;font-variant-numeric:tabular-nums}tr[data-action]{cursor:pointer}tr[data-action]:hover{background:#f0faf9}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;color:#365468;font-size:.87rem;font-weight:600}input,select{font:inherit;display:block;width:100%;margin-top:5px;padding:10px;border:1px solid #a9bec6;border-radius:8px;color:#17384e;background:white}input:focus{outline:2px solid #087f78}fieldset{border:1px solid #d8e4e8;border-radius:12px;margin:16px 0;padding:16px}legend{font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.hint{font-size:.9rem;color:#536a78}.notice{padding:12px 16px;border-radius:10px;background:#fff4d8;color:#674b13;margin:12px 0}.error{color:#a8232c;font-weight:600}.negative{color:#a8232c}.positive{color:#087f78}details{margin-top:20px}summary{cursor:pointer;font-weight:700}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.formgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){header{display:block;padding:18px}nav{margin-top:14px}.cards,.formgrid{grid-template-columns:1fr 1fr}.card{padding:14px}.card strong{font-size:1.35rem}main{padding:18px 14px}.formgrid{grid-template-columns:1fr}}
</style></head><body><header><h1>Solar & Battery Tracker</h1><nav id="nav"></nav></header><main id="app"></main><script src="./app.js"></script></body></html>
